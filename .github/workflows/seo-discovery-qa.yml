name: Visual Art AI — SEO discovery QA

on:
  pull_request:
    paths:
      - "site/**"
      - "scripts/check-seo-discovery.mjs"
      - ".github/workflows/seo-discovery-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate sitemap RSS index canonical and Google policy
        run: node scripts/check-seo-discovery.mjs
