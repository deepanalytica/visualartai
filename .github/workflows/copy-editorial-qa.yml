name: Visual Art AI — Spanish Editorial QA

on:
  pull_request:
    paths:
      - "site/**"
      - "scripts/check-public-copy-es.mjs"
      - ".github/workflows/copy-editorial-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy-es-cl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check published Spanish copy
        run: node scripts/check-public-copy-es.mjs
