<svg xmlns="http://www.w3.org/2000/svg" width="292" height="44" viewBox="0 0 292 44" role="img" aria-labelledby="title desc">
<title id="title">Visual Art AI</title>
<desc id="desc">Visual Art AI — Visibilidad en la nueva búsqueda. Símbolo de señal, búsqueda y descubrimiento.</desc>
<style>
  :root{color:#171715}
  .ring{fill:none;stroke:#D6D2CC;stroke-width:1.05}
  .orbit{fill:none;stroke:#D94A2B;stroke-width:1.65;stroke-linecap:round;stroke-dasharray:35;stroke-dashoffset:35;animation:o 5.2s cubic-bezier(.22,1,.36,1) infinite}
  .core{fill:#D94A2B;transform-origin:19px 19px;animation:c 5.2s ease-in-out infinite}
  .node{fill:#171715;opacity:.72}.muted{opacity:.34}
  .signal{fill:#D94A2B;animation:s 5.2s cubic-bezier(.4,0,.2,1) infinite}
  .spark{fill:#FF7254;opacity:0;transform-origin:31.2px 9.6px;animation:k 5.2s ease-in-out infinite}
  .word{fill:#171715;font-family:Inter,"Helvetica Neue",Arial,sans-serif;font-size:12.7px;font-weight:760;letter-spacing:1.62px}
  .a{fill:none;stroke:#171715;stroke-width:1.72;stroke-linecap:round;stroke-linejoin:round}
  .tag{fill:#514E46;font-family:Inter,"Helvetica Neue",Arial,sans-serif;font-size:8.6px;font-weight:520;letter-spacing:.08px}
  @keyframes o{0%,13%{stroke-dashoffset:35;opacity:.25}31%,76%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:.34}}
  @keyframes c{0%,100%{transform:scale(1)}48%{transform:scale(1.13)}64%{transform:scale(1)}}
  @keyframes s{0%{transform:translate(0,0);opacity:0}12%{opacity:1}34%{transform:translate(8px,-5px)}56%{transform:translate(15px,-8px)}74%{transform:translate(22.4px,-13px);opacity:1}89%,100%{transform:translate(22.4px,-13px);opacity:0}}
  @keyframes k{0%,69%{opacity:0;transform:scale(.72)}78%{opacity:1;transform:scale(1.12) rotate(10deg)}91%{opacity:.48;transform:scale(1)}100%{opacity:0;transform:scale(.84)}}
  @media(prefers-reduced-motion:reduce){.orbit,.core,.signal,.spark{animation:none}.orbit{stroke-dashoffset:0;opacity:1}.signal{opacity:.9;transform:translate(22.4px,-13px)}.spark{opacity:.72}}
</style>
<g transform="translate(1 3)">
  <circle class="ring" cx="19" cy="19" r="15.4"/>
  <path class="orbit" d="M6.8 23.8C9.9 14.7 18 9.8 27.1 11.5c3.5.7 6.1 2.2 8.1 4.5"/>
  <circle class="core" cx="19" cy="19" r="4.25"/>
  <circle class="node" cx="29.2" cy="10.8" r="1.55"/>
  <circle class="node muted" cx="10.1" cy="26.7" r="1.35"/>
  <circle class="signal" cx="6.8" cy="23.8" r="1.7"/>
  <path class="spark" d="M31.2 6.8l.78 2.05 2.05.78-2.05.78-.78 2.05-.78-2.05-2.05-.78 2.05-.78z"/>
</g>
<text x="43" y="18.4" class="word">VISU</text>
<path class="a" d="M83.8 18.2L89 6.8l5.2 11.4M86.2 13.1h5.6"/>
<text x="97.5" y="18.4" class="word">L ART AI</text>
<text x="43" y="34.2" class="tag">Visibilidad en la nueva búsqueda</text>
</svg>