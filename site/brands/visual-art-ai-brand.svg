<svg xmlns="http://www.w3.org/2000/svg" width="248" height="42" viewBox="0 0 248 42" role="img" aria-labelledby="t d">
<title id="t">Visual Art AI</title>
<desc id="d">Visual Art AI — Visibilidad en la nueva búsqueda.</desc>
<style>
  .word{font:780 12.4px Inter,"Helvetica Neue",Arial,sans-serif;letter-spacing:1.85px;fill:#171715}
  .tag{font:520 9px Inter,"Helvetica Neue",Arial,sans-serif;letter-spacing:.14px;fill:#514E46}
  .arc{stroke-dasharray:34;animation:arc 4.8s cubic-bezier(.22,1,.36,1) infinite}
  .dot{transform-origin:18px 18px;animation:dot 4.8s ease-in-out infinite}
  @keyframes arc{0%,14%{stroke-dashoffset:34;opacity:.28}34%,76%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:.38}}
  @keyframes dot{0%,100%{transform:scale(.92);opacity:.72}50%{transform:scale(1.18);opacity:1}}
  @media(prefers-reduced-motion:reduce){.arc,.dot{animation:none}.arc{stroke-dashoffset:0}}
</style>
<g transform="translate(1 3)">
  <circle cx="18" cy="18" r="14.25" fill="none" stroke="#171715" stroke-opacity=".18" stroke-width="1.25"/>
  <path class="arc" d="M7.8 22.7A11.3 11.3 0 0 1 25.8 9.2" fill="none" stroke="#D94A2B" stroke-width="2" stroke-linecap="round"/>
  <circle class="dot" cx="7.8" cy="22.7" r="2.15" fill="#D94A2B"/>
  <circle cx="18" cy="18" r="2.25" fill="#171715"/>
</g>
<text x="43" y="16.8" class="word">VISU</text>
<path d="M82.2 17.2L87 5.4l4.8 11.8" fill="none" stroke="#171715" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
<text x="95" y="16.8" class="word">L ART AI</text>
<text x="43" y="31.2" class="tag">Visibilidad en la nueva búsqueda</text>
</svg>