<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#f4efe5"/><rect x="44" y="44" width="992" height="1262" fill="none" stroke="#a37e4e" opacity=".6"/><text x="90" y="130" font-family="Arial,sans-serif" font-size="22" letter-spacing="5" fill="#a37e4e">LARA &amp; VALDIVIA / ABOGADOS</text><line x1="90" y1="175" x2="990" y2="175" stroke="#a37e4e"/><text x="90" y="250" font-family="Arial,sans-serif" font-size="19" letter-spacing="4" fill="#a37e4e">GUÍA PRÁCTICA</text><text x="90" y="350" font-family="Georgia,serif" font-size="62" fill="#10243e">¿Qué llevar a tu</text><text x="90" y="427" font-family="Georgia,serif" font-size="62" fill="#10243e">primera consulta?</text><text x="92" y="720" font-family="Arial,sans-serif" font-size="25" fill="#10243e">Reúne antecedentes, fechas y las</text><text x="92" y="758" font-family="Arial,sans-serif" font-size="25" fill="#10243e">preguntas que no quieres olvidar.</text><line x1="90" y1="1120" x2="990" y2="1120" stroke="#a37e4e"/><text x="90" y="1180" font-family="Arial,sans-serif" font-size="19" letter-spacing="3" fill="#a37e4e">ORIENTACIÓN · CLARIDAD · CERCANÍA</text><text x="90" y="1230" font-family="Arial,sans-serif" font-size="18" fill="#10243e">Muestra conceptual · contenido sujeto a revisión</text><defs><clipPath id="logo"><circle cx="940" cy="1190" r="54"/></clipPath></defs><image x="886" y="1136" width="108" height="108" clip-path="url(#logo)" href="data:image/webp;base64,"/></svg>